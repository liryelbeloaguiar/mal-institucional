<section class="services">
  <div class="container services__layout">
    <app-section-header
      eyebrow="O que desenvolvemos"
      title="Soluções digitais para o seu negócio"
      description="Do sistema interno à automação: construímos o que torna a operação mais simples."
    />
    <div class="services__grid">
      @for (service of services; track service.title; let i = $index) {
        <app-icon-card
          [title]="service.title"
          [description]="service.description"
          [icon]="service.icon"
          [index]="'0' + (i + 1)"
        />
      }
    </div>
  </div>
</section>
